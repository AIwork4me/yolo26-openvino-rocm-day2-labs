name: ci

on:
  push:
    branches: [main, "release/v2.0.1-r1-r3-validated"]
  pull_request:
    branches: [main]

jobs:
  cpu-tests:
    # GitHub Actions runners have no AMD GPU / ROCm; hardware-dependent tests
    # detect their environment and skip. This job validates the pure-python
    # course tooling: statistics, manifests, chart code, notebook JSON.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pandas nbformat pytest pytest-timeout opencv-python-headless
      - name: Compile all course code
        run: python -m compileall course scripts tests -q
      - name: "Unit tests: v2.0.1 regression coverage"
        run: python -m pytest -q tests/test_units.py tests/test_v201_fixes.py tests/test_release_docs.py
      - name: Notebooks are valid, bilingual and have student parameters
        run: python tests/validate_notebooks.py
      - name: Benchmark protocol files exist
        run: |
          test -f docs/BENCHMARK_PROTOCOL.md
          test -f docs/SLIDE_28_51_EVIDENCE_MAP.md
          test -f constraints-rocm.txt
          test -f scripts/verify_data.py
          test -f scripts/verify_evidence.py
          test -f scripts/audit_benchmarks.py
          test -f scripts/execute_notebooks.py
          test -f scripts/run_campaign.py
          test -f scripts/measure_openvino_sizes.py
          python -m pytest -q tests/test_release_docs.py

  regenerate-slide-assets:
    # Re-render the six PNG+SVG chart pairs on the evidence branch. No GPU,
    # model weights or OpenVINO dependencies are needed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v2.0.1-r1-r3-validated'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install chart dependencies
        run: python -m pip install numpy matplotlib
      - name: Render charts from sealed v2.0.1 campaign
        run: python scripts/make_campaign_charts.py --campaign validation/v2.0.1/campaigns/c20261108_1108
      - name: Commit corrected PNG and SVG assets
        run: |
          git add assets/slides/*.png assets/slides/*.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(charts): render v2.0.1 campaign figures with corrected semantics"
            git push origin HEAD:release/v2.0.1-r1-r3-validated
          fi
